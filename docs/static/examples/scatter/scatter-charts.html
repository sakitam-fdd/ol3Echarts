<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>scatter-charts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }
    .hmap-control-zoom {
      right: 30px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<script src="../ajax.js"></script>
<!--<script src="../../../../packages/ol3-echarts/dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [113.53450137499999, 34.44104525],
      zoom: 5
    })
  });
  getJSON('../../json/scatter.json', function (res) {
    if (res) {
      var data = res.locations;
      var geoCoordMap = res.coordinates;
      var convertData = function (data) {
        var res = [];
        for (var i = 0; i < data.length; i++) {
          var geoCoord = geoCoordMap[data[i].name];
          if (geoCoord) {
            res.push({
              name: data[i].name,
              value: geoCoord.concat(data[i].value)
            });
          }
        }
        return res;
      };
      var option = {
        title: {
          text: '全国主要城市空气质量',
          subtext: 'data from PM25.in',
          sublink: 'https://www.pm25.in',
          left: 'center',
          textStyle: {
            color: '#fff'
          }
        },
        tooltip: {
          trigger: 'item'
        },
        openlayers: {},
        legend: {
          orient: 'vertical',
          y: 'top',
          x: 'right',
          data: ['pm2.5'],
          textStyle: {
            color: '#fff'
          }
        },
        series: [
          {
            name: 'pm2.5',
            type: 'scatter',
            data: convertData(data),
            symbolSize: function (val) {
              return val[2] / 10;
            },
            label: {
              normal: {
                formatter: '{b}',
                position: 'right',
                show: false
              },
              emphasis: {
                show: true
              }
            },
            itemStyle: {
              normal: {
                color: '#ddb926'
              }
            }
          },
          {
            name: 'Top 5',
            type: 'effectScatter',
            data: convertData(data.sort(function (a, b) {
              return b.value - a.value;
            }).slice(0, 6)),
            symbolSize: function (val) {
              return val[2] / 10;
            },
            showEffectOn: 'render',
            rippleEffect: {
              brushType: 'stroke'
            },
            hoverAnimation: true,
            label: {
              normal: {
                formatter: '{b}',
                position: 'right',
                show: true
              }
            },
            itemStyle: {
              normal: {
                color: '#f4e925',
                shadowBlur: 10,
                shadowColor: '#333'
              }
            },
            zlevel: 1
          }]
      };
      var echartslayer = new EChartsLayer(option, {
        stopEvent: false,
        hideOnMoving: true,
        hideOnZooming: true,
        forcedPrecomposeRerender: false,
      });

      echartslayer.on('load', (data) => {
        let center = map.getView().getCenter();
        map.getView().animate({
          center: [center[0] + 0.8, center[1] + 0.4],
          duration: 1000,
        });

        console.log(echartslayer.isVisible());
        echartslayer.setVisible(false);/*echartslayer.setVisible(false);*/

        setTimeout(() => {
          console.log(echartslayer.isVisible());
          // echartslayer.remove();
        }, 500)

        setTimeout(() => {
          console.log(echartslayer.isVisible());
          // echartslayer.remove();
          // echartslayer.setVisible(true);
        }, 2500);

        setTimeout(() => {
          data.value._zr.on('click', (event) => {
            console.log(event);
          }, this)
          // data.value.dispatchAction({
          //   type: 'click',
          //   start: 20,
          //   end: 30
          // });
        }, 3000)
      });

      echartslayer.on('load', (data) => {
        data.value.on('click', (event) => {
          console.log('click', event);
        });

        data.value.on('dblclick', (event) => {
          console.log('dblclick', event);
        });

        data.value.on('mousedown', (event) => {
          console.log('mousedown', event);
        });

        data.value.on('mousemove', (event) => {
          console.log('mousemove', event);
        });

        data.value.on('mouseup', (event) => {
          console.log('mouseup', event);
        });

        data.value.on('mouseover', (event) => {
          console.log('mouseover', event);
        });

        data.value.on('mouseout', (event) => {
          console.log('mouseout', event);
        });

        data.value.on('globalout', (event) => {
          console.log('globalout', event);
        });

        data.value.on('contextmenu', (event) => {
          console.log('contextmenu', event);
        });
      });

      echartslayer.appendTo(map);
    }
  });
</script>
</body>
</html>
