<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>lines-ny</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }
    .hmap-control-zoom {
      right: 30px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [-74.04327099998152, 40.86737600240287],
      zoom: 10
    })
  });
  var CHUNK_COUNT = 10;
  var dataCount = 0;
  var option = {
    progressive: 20000,
    backgroundColor: 'transparent',
    series: [{
      type: 'lines',
      blendMode: 'lighter',
      dimensions: ['value'],
      data: new Float64Array(),
      polyline: true,
      large: true,
      lineStyle: {
        color: 'orange',
        width: 0.5,
        opacity: 0.3
      }
    }]
  };
  var echartslayer = new EChartsLayer(option, {
    hideOnMoving: true,
    hideOnZooming: true
  });
  echartslayer.appendTo(map);
  function fetchData(idx) {
    if (idx >= CHUNK_COUNT) {
      return;
    }
    var dataURL = `./data/links_ny_${idx}.bin`
    var xhr = new XMLHttpRequest();
    xhr.open('GET', dataURL, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function (e) {
      var rawData = new Float32Array(this.response);
      var data = new Float64Array(rawData.length - 2);
      var offsetX = rawData[0];
      var offsetY = rawData[1];
      var off = 0;
      var addedDataCount = 0;
      for (var i = 2; i < rawData.length;) {
        var count = rawData[i++];
        data[off++] = count;
        for (var k = 0; k < count; k++) {
          var x = rawData[i++] + offsetX;
          var y = rawData[i++] + offsetY;
          data[off++] = x;
          data[off++] = y;
          addedDataCount++;
        }
      }
      echartslayer.appendData({
        seriesIndex: 0,
        data: data
      }, true);
      dataCount += addedDataCount;
      fetchData(idx + 1);
    };
    xhr.send();
  }
  fetchData(0);
</script>
</body>
</html>
