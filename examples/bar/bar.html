<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>柱状图</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .hmap-control-zoom {
      right: 30px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [113.53450137499999, 34.44104525],
      zoom: 5
    })
  });

  var options = {
    color: ['#3398DB'],
    tooltip : {
      trigger: 'axis',
      axisPointer : {            // 坐标轴指示器，坐标轴触发有效
        type : 'shadow'        // 默认为直线，可选为：'line' | 'shadow'
      }
    },
    legend: {
      x: "left",
      show: true,
      data: ['包租费', '物业费', '水电', '网络', '燃气'],
      selectedMode: 'multiple'
    },
    grid: [],
    xAxis : [],
    yAxis : [],
    series: []
  }

  var series = [
    {
      name: '包租费',
      type: 'bar',
      barWidth: '15',
      coordinates: [87.1435546875, 43.79150390625],
      data: [20, 12, 31, 34, 31],
      xAxisIndex: 0,
      yAxisIndex: 0
    },
    {
      name:'物业费',
      type:'bar',
      barWidth: '15',
      coordinates: [86.5283203125, 32.40966796875],
      data: [1, 1, 2, 3, 1],
      xAxisIndex: 1,
      yAxisIndex: 1
    },
    {
      name:'水电',
      type:'bar',
      barWidth: '15',
      coordinates: [98.876953125, 35.74951171875],
      data: [1, 1, 2, 3, 1],
      xAxisIndex: 2,
      yAxisIndex: 2
    },
    {
      name:'网络',
      type:'bar',
      barWidth: '15',
      coordinates: [108.80859375, 23.44482421875],
      data: [1, 1, 2, 3, 1],
      xAxisIndex: 3,
      yAxisIndex: 3
    },
    {
      name:'燃气',
      type:'bar',
      barWidth: '15',
      coordinates: [110.53450137499999, 38.44104525],
      data: [1, 1, 2, 3, 1],
      xAxisIndex: 4,
      yAxisIndex: 4
    }
  ];

  series.forEach(function (item, index) {
    options.grid.push({
      show: true,
      containLabel: false,
      borderWidth: 0,
      borderColor: '#fff',
      width: 150,
      height: 80
    });
    options.xAxis.push({
      type : 'category',
      show: true,
      gridIndex: index,
      nameTextStyle: {
        color: '#3c3c3c'
      },
      axisLine: {
        show: false,
        onZero: false
      },
      axisLabel: {
        show: false,
        interval: 0,
        rotate: -45,
        color: '#3c3c3c',
        fontSize: 10
      },
      axisTick: {
        show: false
      },
      data : ['新虹桥', '中山公园', '虹桥', '镇宁路', '天山古北']
    });
    options.yAxis.push({
      type: 'value',
      show: true,
      min: 0.001,
      splitLine: {show: false},
      axisLabel: {
        show: false
      },
      axisLine: {
        show: false,
        onZero: false
      },
      nameGap: '1',
      axisTick: {
        show: false
      },
      nameTextStyle: {
        color: '#3c3c3c',
        fontSize: 14
      },
      gridIndex: index
    });
    options.series.push(item)
  })

  var echartslayer = new EChartsLayer(options);
  echartslayer.appendTo(map);
</script>
</body>
</html>
