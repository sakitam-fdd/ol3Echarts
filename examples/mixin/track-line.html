<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>杭州热门步行路线</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .hmap-control-zoom {
      right: 30px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="../ajax.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [120.13066322374, 30.240018034923],
      zoom: 14
    })
  });
  var echartslayer = new EChartsLayer(null, {
    hideOnMoving: false
  });
  echartslayer.appendTo(map);
  getJSON('../../json/tracks.json', function (data) {
    var lines = data.map(function (track) {
      return {
        coords: track.map(function (seg, idx) {
          return seg.coord;
        })
      };
    })
    var option = {
      title: {
        text: '杭州热门步行路线',
        left: 'center',
        textStyle: {
          color: '#eee'
        }
      },
      backgroundColor: 'transparent',
      series: [{
        type: 'lines',
        data: lines,
        polyline: true,
        lineStyle: {
          normal: {
            color: '#ddb926',
            opacity: 0.6,
            width: 1
          }
        }
      }]
    };
    echartslayer.setChartOptions(option);
  });
</script>
</body>
</html>
