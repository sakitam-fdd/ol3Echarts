<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>轨迹图</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }
    .hmap-control-zoom {
      right: 30px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<script src="../../assets/scripts/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var Maps = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [113.53450137499999, 34.44104525],
      zoom: 5
    })
  });
  var echartslayer = new EChartsLayer(null, {
    hideOnMoving: true,
    hideOnZooming: true
  });
  echartslayer.appendTo(Maps);
  $fetch.get('../../data/bus.json').then(function (res) {
    var windData = res.data;
    var taxiRoutes = [];
    var data = windData.data;
    for (var x in data) {
      var line = data[x];
      var pointString = line.ROAD_LINE;
      var pointArr = pointString.split(';');
      var lnglats = [];
      for (var j in pointArr) {
        lnglats.push(pointArr[j].split(','))
      }
      taxiRoutes.push({
        coords: lnglats,
        lineStyle: {
          // color: echarts.color.modifyHSL('#5A94DF', Math.round(hStep * x))
        }
      })
    }
    var option = {
      title: {
        text: '轨迹图',
        left: 'center',
        top: 'top',
        textStyle: {
          color: '#fff'
        }
      },
      series: [
        {
          type: 'lines3D',
          effect: {
            show: true,
            constantSpeed: 5,
            trailWidth: 2,
            trailLength: 0.4,
            trailOpacity: 1,
            spotIntensity: 10
          },
          blendMode: 'lighter',
          polyline: true,
          lineStyle: {
            width: 0.1,
            color: 'rgb(200, 40, 0)',
            opacity: 0.
          },
          data: {
            count: function () {
              return taxiRoutes.length;
            },
            getItem: function (idx) {
              return taxiRoutes[idx]
            }
          }
        }
      ]
    };
    echartslayer.setChartOptions(option);
  });
</script>
</body>
</html>
