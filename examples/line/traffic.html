<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>嘉兴市公交线路道路拥堵情况</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="../ajax.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [120.76264061813247, 30.74805248565917],
      zoom: 12
    })
  });
  var echartslayer = new EChartsLayer(null, {
    hideOnMoving: true,
    hideOnZooming: true
  });
  echartslayer.appendTo(map);
  getJSON('../../json/traffic.json', function (data) {
    if (data) {
      // 配置项
      var option = {
        visualMap: {
          type: "piecewise",
          left: 'right',
          top: 'top',
          /*            pieces: [
           {min: 15}, // 不指定 max，表示 max 为无限大（Infinity）。
           {min: 12, max: 15},
           {min: 9, max: 12},
           {min: 6, max: 9},
           {min: 3, max: 6},
           {max: 3}     // 不指定 min，表示 min 为无限大（-Infinity）。
           ],*/
          min: 0,
          max: 15,
          splitNumber: 5,
          maxOpen: true,
          color: ['red', 'yellow', 'green']
        },
        tooltip: {
          formatter: function (params, ticket, callback) {
            return "拥堵指数:" + params.value;
          },
          trigger: 'item'
        },
        series: [
          {
            type: 'lines',
            polyline: true,
            lineStyle: {
              normal: {
                opacity: 1,
                width: 4
              },
              emphasis: {
                width: 6
              }
            },
            effect: {
              show: true,
              symbolSize: 2,
              color: "white"
            }
          }
        ]
      };
      option.series[0].data = convertData(data);
      echartslayer.setChartOptions(option);
    }
  });
  // 处理数据
  function convertData (sourceData) {
    return [].concat.apply([], sourceData.map(function (busLine, index) {
      var prevPoint = null;
      var points = [];
      var value = busLine.shift();
      for (var i = 0; i < busLine.length; i += 2) {
        var point = [busLine[i], busLine[i + 1]];
        if (i > 0) {
          point = [
            prevPoint[0] + point[0],
            prevPoint[1] + point[1]
          ];
        }
        prevPoint = point;
        points.push([point[0] / 1e5, point[1] / 1e5]);
      }
      return {
        value: value,
        coords: points
      };
    }));
  }
</script>
</body>
</html>
