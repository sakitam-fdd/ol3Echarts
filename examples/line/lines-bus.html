<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>lines-airline-china</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }
    .hmap-control-zoom {
      right: 30px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="../ajax.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [116.28245, 39.92121],
      zoom: 9
    })
  });
  var echartslayer = new EChartsLayer(null, {
    hideOnMoving: true,
    hideOnZooming: true
  });
  echartslayer.appendTo(map);
  getJSON('../../json/lines-bus.json', function (rawData) {
    var hStep = 300 / (rawData.length - 1);
    var busLines = [].concat.apply([], rawData.map(function (busLine, idx) {
      var prevPt;
      var points = [];
      for (var i = 0; i < busLine.length; i += 2) {
        var pt = [busLine[i], busLine[i + 1]];
        if (i > 0) {
          pt = [
            prevPt[0] + pt[0],
            prevPt[1] + pt[1]
          ];
        }
        prevPt = pt;

        points.push([pt[0] / 1e4, pt[1] / 1e4]);
      }
      return {
        'coords': points,
        'lineStyle': {
          'normal': {
            'color': echarts.color.modifyHSL('#5A94DF', Math.round(hStep * idx))
          }
        }
      };
    }));
    var option = {
      'series': [
        {
          'type': 'lines',
          'polyline': true,
          'data': busLines,
          'lineStyle': {
            'normal': {
              'width': 0
            }
          },
          'effect': {
            'constantSpeed': 20,
            'show': true,
            'trailLength': 0.5,
            'symbolSize': 1.5
          },
          'zlevel': 1
        }
      ]
    };
    echartslayer.setChartOptions(option);
  });
</script>
</body>
</html>
