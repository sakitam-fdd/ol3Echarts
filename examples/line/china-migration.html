<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>春节人口迁徙</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="../ajax.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<!--<script src="../../../dist/ol3Echarts.js"></script>-->
<script>
  var map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [113.53450137499999, 34.44104525],
      zoom: 5
    })
  });
  var echartslayer = new EChartsLayer(null, {
    hideOnMoving: true,
    hideOnZooming: true
  });
  echartslayer.appendTo(map);
  getJSON('../../json/china-migration.json', function (geoCoord) {
    if (geoCoord) {
      getJSON('../../json/china-airline.json', function (data) {
        if (data) {
          var option = {
            backgroundColor: 'transparent',
            title: {
              text: '春节人口迁徙',
              x: 'center',
              y: 'top',
              textStyle: {
                color: 'white'
              }
            },
            legend: {
              show: true,
              selected: {},
              x: 'left',
              orient: 'vertical',
              textStyle: {
                color: 'white'
              },
              data: []
            },
            series: [
              {
                name: "Migration",
                type: 'lines',
                effect: {
                  constantSpeed: 30,
                  show: true,
                  trailLength: 1,
                  symbolSize: 1.5,
                  color: 'rgba(204, 246, 255, 1)',
                },

                itemStyle: {
                  normal: {
                    lineStyle: {
                      color: 'rgba(2, 166, 253, 1)',
                      type: 'solid',
                      width: 0.5,
                      opacity: 0.4
                    }
                  }
                },
                data: []
              }, {
                symbol: 'circle',
                type: 'effectScatter',
                symbolSize: 1.5,
                itemStyle: {
                  normal: {
                    color: 'rgba(255, 0, 0, 1)'
                  }
                },
                data: []
              }
            ]
          };
          data.allLine.sort(function(a, b) {
            return b.num - a.num
          }).slice(0, 3000).map(function(line) {
            option.series[0].data.push(getLineCoord(geoCoord, line.start, line.end));
          });
          option.series[1].data = data.topCityOut.map(function(point) {
            return {
              value: getGeoCoord(geoCoord, point.name)
            }
          });
          echartslayer.setChartOptions(option);
        }
      });
    }
  });

  // 经纬度获取
  function getGeoCoord (geoCoord, name) {
    var city = name.split('_').pop();
    var coord = geoCoord[city];
    return coord;
  }
  // 线路获取
  function getLineCoord (geoCoord, fromname, toname) {
    fromname = fromname.split('_').pop();
    var fromCoord = geoCoord[fromname];
    toname = toname.split('_').pop();
    var toCoord = geoCoord[toname];
    return {
      fromName: fromname,
      toName: toname,
      coords: [fromCoord, toCoord]
    }
  }
</script>
</body>
</html>
