<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLayers + ol-echarts 迁徙图</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.9.0/ol.css">
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.9.0/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-echarts@4.0.1/dist/ol-echarts.js"></script>
<script>
  const map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM(),
      }),
    ],
    view: new ol.View({
      projection: 'EPSG:4326',
      center: [113.53450137499999, 34.44104525],
      zoom: 5,
    }),
  });

  const geoCoordMap = {
    上海: [121.4648, 31.2891],
    北京: [116.4551, 40.2539],
    广州: [113.5107, 23.2196],
    深圳: [114.5435, 22.5431],
    成都: [103.9526, 30.7617],
    武汉: [114.3896, 30.6628],
    西安: [109.1162, 34.2004],
    杭州: [119.5313, 29.8773],
  };

  const BJData = [
    [{ name: '北京' }, { name: '上海', value: 95 }],
    [{ name: '北京' }, { name: '广州', value: 90 }],
    [{ name: '北京' }, { name: '深圳', value: 80 }],
    [{ name: '北京' }, { name: '成都', value: 70 }],
    [{ name: '北京' }, { name: '武汉', value: 60 }],
    [{ name: '北京' }, { name: '杭州', value: 50 }],
  ];

  const convertData = (data) => {
    const res = [];
    for (let i = 0; i < data.length; i++) {
      const from = geoCoordMap[data[i][0].name];
      const to = geoCoordMap[data[i][1].name];
      if (from && to) {
        res.push({
          fromName: data[i][0].name,
          toName: data[i][1].name,
          coords: [from, to],
          value: data[i][1].value,
        });
      }
    }
    return res;
  };

  const layer = new EChartsLayer(
    {
      tooltip: {
        trigger: 'item',
        formatter: (params) => {
          if (params.seriesType === 'effectScatter') {
            return `${params.data.name}: ${params.data.value[2]}`;
          }
          if (params.seriesType === 'lines') {
            return `${params.data.fromName} → ${params.data.toName}<br/>${params.data.value}`;
          }
          return params.name;
        },
      },
      series: [
        {
          name: '北京迁徙',
          type: 'lines',
          zlevel: 1,
          effect: {
            show: true,
            period: 6,
            trailLength: 0.7,
            color: '#fff',
            symbolSize: 3,
          },
          lineStyle: {
            color: '#a6c84c',
            width: 0,
            curveness: 0.2,
          },
          data: convertData(BJData),
        },
        {
          name: '北京迁徙',
          type: 'lines',
          zlevel: 2,
          effect: {
            show: true,
            period: 6,
            trailLength: 0,
            symbol: 'arrow',
            symbolSize: 8,
          },
          lineStyle: {
            color: '#a6c84c',
            width: 1,
            opacity: 0.6,
            curveness: 0.2,
          },
          data: convertData(BJData),
        },
        {
          name: '北京迁徙',
          type: 'effectScatter',
          zlevel: 2,
          rippleEffect: { brushType: 'stroke' },
          label: {
            show: true,
            position: 'right',
            formatter: '{b}',
          },
          symbolSize: (val) => val[2] / 8,
          itemStyle: { color: '#a6c84c' },
          data: BJData.map((item) => ({
            name: item[1].name,
            value: geoCoordMap[item[1].name].concat([item[1].value]),
          })),
        },
      ],
    },
    {
      hideOnMoving: true,
      hideOnZooming: true,
    },
  );

  layer.appendTo(map);
</script>
</body>
</html>
