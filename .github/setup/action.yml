name: Setup workspace
description: Install the declared Node.js and pnpm toolchain with a frozen lockfile

inputs:
  node-version:
    description: Node.js version used by the job
    required: false
    default: '24.x'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
