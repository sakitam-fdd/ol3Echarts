name: Publish docs

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/setup/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/setup

      - name: Build packages
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PKG_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          cname: blog.sakitam.com
