name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Lint
        if: matrix.node == '24.x'
        run: pnpm lint

      - name: Test
        if: matrix.node == '22.x'
        run: pnpm test-only

      - name: Test with coverage
        if: matrix.node == '24.x'
        run: pnpm coverage

      - name: Build packages
        run: pnpm build

      - name: Build documentation
        if: matrix.node == '24.x'
        run: pnpm docs:build

      - name: Upload coverage
        if: matrix.node == '24.x'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
